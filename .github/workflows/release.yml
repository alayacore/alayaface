name: Release
on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    outputs:
      frontend_path: ${{ steps.upload.outputs.path }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Frontend
        run: |
          cd src-elm
          wget https://github.com/elm/compiler/releases/download/0.19.2/elm-0.19.2-linux-x64.gz
          gunzip elm-0.19.2-linux-x64.gz
          chmod +x elm-0.19.2-linux-x64
          mv elm-0.19.2-linux-x64 elm
          ./elm make src/Main.elm --output=elm.js
      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-assets
          path: src-elm/elm.js

  publish-tauri:
    needs: build-frontend
    # Required by softprops/action-gh-release to create the GitHub Release.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # Unified naming: arch is arm64/amd64 (matches alayacore's
        # release asset names); os is one of macos/windows/linux.
        # The Rust target triple is derived from (os, arch) below
        # because Rust requires the historical aarch64/x86_64 names —
        # the surface here stays clean for the user, the plumbing
        # is in the install-alayacore step.
        #
        # Windows arm64 is intentionally omitted: GitHub's public
        # runners don't include an ARM64 Windows image (`windows-
        # latest` is x86_64 Windows Server 2022). The ARM64 image
        # (`windows-11-arm`) requires GitHub Team/Enterprise. Cross-
        # compiling from x86_64 is technically possible, but we'd
        # be shipping an installer we never ran on the target CPU.
        # Until the runner constraint lifts, ARM64 Windows users
        # build from source.
        include:
          - os: macos
            arch: arm64
            runner: macos-latest
          - os: macos
            arch: amd64
            runner: macos-latest
          - os: windows
            arch: amd64
            runner: windows-latest
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: linux
            arch: amd64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-assets
          path: src-elm/
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu, x86_64-apple-darwin, aarch64-apple-darwin, x86_64-pc-windows-msvc, aarch64-pc-windows-msvc
      - name: Install dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev libxdo-dev libglib2.0-dev xdg-utils
      - name: Install Tauri CLI
        run: cargo install tauri-cli
      # Bundle alayacore with the desktop app — the build script
      # picks it up via the binaries/alayacore-<target> path and
      # Tauri ships it in the install next to the main executable.
      # The user's first launch prefers the bundled copy over PATH
      # search (see alayacore.rs::find_binary).
      #
      # Strategy: pin NOTHING. Pull the latest stable alayacore at
      # tag-push time. If alayacore ships a breaking change,
      # AlayaFace is updated alongside it (the two are versioned
      # together); pinning here would risk a release that bundles
      # a stale alayacore while the user otherwise has a newer one
      # installed. Download from the pre-built release assets
      # (`alayacore-{darwin,linux,windows}-{amd64,arm64}[.exe]`)
      # so we don't need a Go toolchain on the runner.
      - name: Install alayacore
        id: install-alayacore
        shell: bash
        run: |
          # `set -euo pipefail` (not just `-e`): a segfaulting
          # `rg --version` is how a structurally-broken ripgrep
          # manifests (exit 139 = 128 + SIGSEGV) — with plain
          # `-e` that signal exit was being masked in some
          # contexts and the broken rg was silently shipped.
          # `-u` catches unset-var typos; `-o pipefail` catches
          # failures inside the `curl … | sha256sum` chain.
          set -euo pipefail
          # Rust's target triple is the historical aarch64/x86_64
          # naming — the mapping is unified on the matrix side
          # (arm64/amd64) and translated here for the build.
          #
          # ripgrep's asset naming uses its own target triples,
          # which match Rust's for macOS and Windows. For Linux,
          # ripgrep publishes a -musl variant only (the x86_64
          # -gnu build was dropped upstream; both arm64 variants
          # still exist but musl is statically linked and avoids
          # the glibc version coupling the desktop app already
          # inherits from its system GTK/WebKit deps).
          case "${{ matrix.os }},${{ matrix.arch }}" in
            macos,arm64)    ALAYACORE_ASSET=alayacore-darwin-arm64;       RUST_TARGET=aarch64-apple-darwin;        RIPGREP_TARGET=aarch64-apple-darwin;       RIPGREP_EXT=tar.gz ;;
            macos,amd64)    ALAYACORE_ASSET=alayacore-darwin-amd64;       RUST_TARGET=x86_64-apple-darwin;         RIPGREP_TARGET=x86_64-apple-darwin;        RIPGREP_EXT=tar.gz ;;
            windows,amd64)  ALAYACORE_ASSET=alayacore-windows-amd64.exe;  RUST_TARGET=x86_64-pc-windows-msvc;      RIPGREP_TARGET=x86_64-pc-windows-msvc;     RIPGREP_EXT=zip ;;
            linux,arm64)    ALAYACORE_ASSET=alayacore-linux-arm64;        RUST_TARGET=aarch64-unknown-linux-gnu;   RIPGREP_TARGET=aarch64-unknown-linux-musl; RIPGREP_EXT=tar.gz ;;
            linux,amd64)    ALAYACORE_ASSET=alayacore-linux-amd64;        RUST_TARGET=x86_64-unknown-linux-gnu;    RIPGREP_TARGET=x86_64-unknown-linux-musl; RIPGREP_EXT=tar.gz ;;
            *) echo "Unsupported (os, arch): ${{ matrix.os }},${{ matrix.arch }}" >&2; exit 1 ;;
          esac

          # Download the latest alayacore binary from GitHub
          # releases. The /releases/latest/download/<asset> URL is
          # a stable redirect that lands on the latest tagged
          # release containing that asset — no version pinning
          # needed (or wanted; see comment above).
          URL="https://github.com/alayacore/alayacore/releases/latest/download/${ALAYACORE_ASSET}"
          echo "Downloading $URL"
          curl -fsSL "$URL" -o /tmp/alayacore-download

          # Tauri's externalBin resolver appends `.exe` to the
          # source path on Windows targets (see tauri-utils
          # `external_binaries`), so the install-time lookup is
          # `binaries/alayacore-<rust_target>.exe`. Match that
          # here — Windows refuses to execute a binary without the
          # `.exe` extension, which would also fail the smoke-test.
          ALAYACORE_BIN="alayacore-${RUST_TARGET}"
          if [ "${{ matrix.os }}" = "windows" ]; then
            ALAYACORE_BIN="${ALAYACORE_BIN}.exe"
          fi

          mkdir -p src-tauri/binaries
          mv /tmp/alayacore-download "src-tauri/binaries/${ALAYACORE_BIN}"
          # Windows .exe files are already executable; chmod is a
          # no-op there but harmless and lets us run the same
          # command on every runner.
          chmod +x "src-tauri/binaries/${ALAYACORE_BIN}" 2>/dev/null || true

          # Smoke-test: if the download or the asset name is wrong,
          # fail loudly here rather than letting the build script
          # silently emit a 0-byte stub. Every matrix entry now
          # runs on a runner that matches the target arch (Windows
          # arm64 is intentionally omitted — see the matrix
          # comment), so alayacore --version works on all of them.
          "src-tauri/binaries/${ALAYACORE_BIN}" --version

          # ─── Bundle ripgrep alongside alayacore ────────────────
          # alayacore uses `rg` (ripgrep) for fast content search,
          # detected via PATH. Tauri's externalBin places both
          # binaries in the same install directory, so the runtime
          # prepends that directory to PATH on alayacore spawn
          # (see alayacore::prepend_rg_to_path) and alayacore
          # picks up the bundled rg first, ahead of any rg the
          # user has installed system-wide.
          #
          # ripgrep's release assets are versioned in the filename
          # (`ripgrep-<version>-<target>.<ext>`), unlike alayacore's
          # which keep a stable per-target name. We can't use the
          # /releases/latest/download/<asset> redirect trick that
          # alayacore uses; instead, follow the /releases/latest
          # redirect to discover the actual tag, then construct
          # the asset URL. Same "latest at tag-push time" semantics
          # as the alayacore install above — no version pinning,
          # so a breaking rg change would be visible at release
          # time alongside any alayacore change.
          RIPGREP_TAG=$(curl -fsSL -o /dev/null -w '%{url_effective}' \
              https://github.com/BurntSushi/ripgrep/releases/latest \
              | sed -E 's|.*/tag/||')
          echo "Latest ripgrep tag: ${RIPGREP_TAG}"

          RIPGREP_ASSET="ripgrep-${RIPGREP_TAG}-${RIPGREP_TARGET}.${RIPGREP_EXT}"
          RIPGREP_URL="https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_TAG}/${RIPGREP_ASSET}"
          echo "Downloading $RIPGREP_URL"
          curl -fsSL "$RIPGREP_URL" -o /tmp/ripgrep-archive

          # ── Verify the tarball against GitHub's published
          # sidecar .sha256 asset. This catches three classes of
          # breakage the smoke test can't:
          #
          #  1. Truncated/corrupted downloads (HTTP 200 with a
          #     partial body — `curl -f` won't catch this).
          #  2. Re-uploaded tarball under the same tag with
          #     different content (would still pass `--version`
          #     if the new build also happens to print a version).
          #  3. Mirror / MITM serving a different file under the
          #     same URL.
          #
          # ripgrep publishes a `${ASSET}.sha256` sidecar next to
          # every tarball/zip — the content is the same sha256sum
          # format `sha256sum` emits (hex + "  filename"), so we
          # can use awk to extract just the hash and compare.
          EXPECTED_SHA=$(curl -fsSL \
              "https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_TAG}/${RIPGREP_ASSET}.sha256" \
              | awk '{print $1}')
          ACTUAL_SHA=$(sha256sum /tmp/ripgrep-archive | awk '{print $1}')
          echo "Expected ripgrep tarball sha256: ${EXPECTED_SHA}"
          echo "Actual   ripgrep tarball sha256: ${ACTUAL_SHA}"
          if [ "${ACTUAL_SHA}" != "${EXPECTED_SHA}" ]; then
            echo "::error::ripgrep tarball sha256 mismatch for ${RIPGREP_ASSET} (got ${ACTUAL_SHA}, expected ${EXPECTED_SHA}) — refusing to bundle a possibly-tampered/corrupted binary"
            exit 1
          fi

          # macOS/Linux tarballs and the Windows zip BOTH put rg/rg.exe
          # at `ripgrep-<tag>-<target>/rg[.exe]` — the Windows zip is
          # not flatter than the tarballs. Extract just the binary
          # (with `-j` on zip) so the destination is always
          # `/tmp/ripgrep-extracted/rg[.exe]` regardless of layout.
          mkdir -p /tmp/ripgrep-extracted
          if [ "$RIPGREP_EXT" = "zip" ]; then
            # `-j` flattens paths so rg.exe lands directly in
            # /tmp/ripgrep-extracted/. The wildcard
            # `ripgrep-*/rg.exe` matches the versioned subdirectory
            # ripgrep puts inside every release zip — a bare `rg.exe`
            # would miss it ("filename not matched"). Git Bash (the
            # shell on the windows-latest runner) ships unzip from
            # the Info-ZIP package.
            unzip -j /tmp/ripgrep-archive 'ripgrep-*/rg.exe' -d /tmp/ripgrep-extracted
            RG_PATH="/tmp/ripgrep-extracted/rg.exe"
          else
            tar -xzf /tmp/ripgrep-archive -C /tmp/ripgrep-extracted
            RG_PATH="/tmp/ripgrep-extracted/ripgrep-${RIPGREP_TAG}-${RIPGREP_TARGET}/rg"
          fi

          # Same `.exe` convention as alayacore above — Tauri's
          # externalBin resolver appends it on Windows source
          # paths, so the source path must already include it or
          # Windows will refuse to exec the smoke-test below.
          RG_BIN="rg-${RUST_TARGET}"
          if [ "${{ matrix.os }}" = "windows" ]; then
            RG_BIN="${RG_BIN}.exe"
          fi
          mv "$RG_PATH" "src-tauri/binaries/${RG_BIN}"
          chmod +x "src-tauri/binaries/${RG_BIN}" 2>/dev/null || true

          # ── Pin the extracted `rg` binary's sha256.
          #
          # The tarball-sha check above catches anything GitHub
          # would call a tampered/corrupted release, but it can't
          # catch the failure mode that produced the broken
          # alayaface_amd64.AppImage on 2026-08-21: a `rg` whose
          # tarball was fine (matched GitHub's digest) but whose
          # ELF layout differed from every published ripgrep
          # artifact — 3 LOAD segments vs. 2, with `.dynamic`
          # moved into a separate LOAD that left a stale `.got`
          # pointer behind, making the binary SIGSEGV in
          # `alayacore`'s CRT init at unrelocated 0x69eb70
          # (an unmapped gap between LOADs). That artifact also
          # had a non-zero `.dynstr` and a `RUNPATH=$ORIGIN/../lib`
          # entry the official `ripgrep-15.2.0-*-linux-musl/rg`
          # does not carry — i.e., it was clearly *not* the binary
          # ripgrep published, but somehow ended up at
          # `binaries/rg-x86_64-unknown-linux-gnu` anyway.
          #
          # Pinning each (target, ripgrep-tag) pair to the binary's
          # own sha256 forces the next build to either reproduce
          # the exact same ripgrep release artifact (good — it's a
          # deterministic upstream build), or fail loudly when
          # ripgrep ships a new release (intended — bump the
          # pin deliberately). The smoke test alone is not
          # sufficient because a freshly-broken `rg --version`
          # segfaults (exit 139), and `set -e`'s default
          # signal-handling is unreliable inside some GH Actions
          # shell contexts — see the `set -euo pipefail` note
          # above.
          #
          # To regenerate: download the tarball for the new tag,
          # extract it, and paste the resulting `sha256sum rg`
          # hash here for the matching RIPGREP_TARGET.
          declare -A EXPECTED_RG_SHA=(
            # ripgrep 15.2.0 (released 2026-07-15) — verified against
            # the tarball at
            # https://github.com/BurntSushi/ripgrep/releases/download/15.2.0/ripgrep-15.2.0-x86_64-unknown-linux-musl.tar.gz
            # sha256(tarball)=33e15bcf1624b25cdd2a55813a47a2f95dbe126268203e76aa6a585d1e7b149c
            ["x86_64-unknown-linux-musl"]="e62198eb19b136b88c330af83647b5a962cb99b6b1f066758568f12de1974849"
            ["aarch64-unknown-linux-musl"]="800b1e7206afe799dfb5a6901f23147cfaabe0e52210538100f61e86e1740915"
          )
          EXPECTED="${EXPECTED_RG_SHA[${RIPGREP_TARGET}]:-}"
          if [ -z "${EXPECTED}" ]; then
            echo "::warning::no pinned rg sha256 for RIPGREP_TARGET=${RIPGREP_TARGET} (tag=${RIPGREP_TAG}) — skipping extracted-binary check. Add one to release.yml's EXPECTED_RG_SHA map before bundling a new target."
          else
            ACTUAL_RG_SHA=$(sha256sum "src-tauri/binaries/${RG_BIN}" | awk '{print $1}')
            echo "Expected rg sha256 (${RIPGREP_TARGET}): ${EXPECTED}"
            echo "Actual   rg sha256 (${RIPGREP_TARGET}): ${ACTUAL_RG_SHA}"
            if [ "${ACTUAL_RG_SHA}" != "${EXPECTED}" ]; then
              echo "::error::bundled rg sha256 mismatch for ${RIPGREP_TARGET} ${RIPGREP_TAG} (got ${ACTUAL_RG_SHA}, expected ${EXPECTED}) — refusing to ship a binary that isn't byte-identical to the upstream ripgrep release"
              exit 1
            fi
          fi

          # Smoke-test: rg --version must succeed (catches wrong
          # target / truncated download / wrong archive layout
          # before the Tauri build runs).
          "src-tauri/binaries/${RG_BIN}" --version

          # Pass the Rust target triple to the build step.
          echo "rust_target=${RUST_TARGET}" >> "$GITHUB_OUTPUT"
      - name: Build App
        # Use ${{ ... }} substitution directly so the script that
        # PowerShell runs on Windows (the default shell on the
        # windows-latest runner) sees the target already expanded —
        # bash-style "$VAR" inside `run:` is not portable to
        # PowerShell, and GitHub's env-block + env-var-on-the-
        # command-line is what made the previous attempt return an
        # empty `--target` on Windows amd64.
        run: |
          cd src-tauri
          cargo tauri build --target "${{ steps.install-alayacore.outputs.rust_target }}"
      - name: Upload Release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd src-tauri

          TAG="${GITHUB_REF#refs/tags/}"
          BUNDLE_DIR="target/${{ steps.install-alayacore.outputs.rust_target }}/release/bundle"

          # Collect every installer artifact Tauri produced for this target.
          # Using 'find' instead of globs so we don't depend on knowing
          # Tauri 2's exact bundle subdirectory layout.
          FILES_TXT="$(mktemp)"
          find "$BUNDLE_DIR" -type f \
              \( -name '*.deb' -o -name '*.AppImage' -o -name '*.msi' -o -name '*.dmg' \) \
              > "$FILES_TXT" 2>/dev/null || true

          if [ ! -s "$FILES_TXT" ]; then
            echo "::warning::No installer files found for ${{ steps.install-alayacore.outputs.rust_target }} under $BUNDLE_DIR"
            echo "Bundle directory contents (for debugging):"
            ls -la "$BUNDLE_DIR" 2>/dev/null || echo "  (bundle directory does not exist)"
            rm -f "$FILES_TXT"
            exit 0
          fi

          FILE_COUNT=$(wc -l < "$FILES_TXT")
          echo "Uploading $FILE_COUNT file(s) to release $TAG:"
          sed 's/^/  /' "$FILES_TXT"

          # Strip the version segment from the filenames. Tauri emits
          # names like {productName}_{version}_{arch}.{ext} (e.g.
          # "alayaface_0.1.0_aarch64.AppImage"); the version in the
          # filename is redundant for our release (the GitHub release
          # tag carries the version), so we rename to
          # {productName}_{arch}.{ext} (e.g. "alayaface_aarch64.AppImage").
          # All platforms use the same pattern so a single sed handles
          # them. The version is still preserved in the bundle metadata
          # (the .deb control file, Windows MSI ProductVersion, macOS
          # Info.plist CFBundleVersion) — only the FILENAME is stripped.
          #
          # Note: tauri.conf.json's `version` field is intentionally
          # set to "0.0.0" (a placeholder, not a real release version)
          # because (a) the GitHub release tag is the real version, and
          # (b) any version string here would just be stripped from the
          # filename anyway. The "0.0.0" makes it loud-and-clear that
          # the field is ignored and the release tag is the source of
          # truth. The sed pattern stays generic so a future bump
          # (e.g. "0.0.1") would still be stripped without touching
          # this script.
          FILES_NEW="$(mktemp)"
          while IFS= read -r f; do
            dir=$(dirname "$f")
            base=$(basename "$f")
            new=$(echo "$base" | sed -E 's/_[0-9]+(\.[0-9]+)+_/_/')
            if [ "$new" != "$base" ]; then
              mv "$f" "$dir/$new"
              echo "  renamed: $base -> $new"
              f="$dir/$new"
            fi
            echo "$f" >> "$FILES_NEW"
          done < "$FILES_TXT"
          mv "$FILES_NEW" "$FILES_TXT"

          FILE_COUNT=$(wc -l < "$FILES_TXT")
          echo "Uploading $FILE_COUNT file(s) to release $TAG:"
          sed 's/^/  /' "$FILES_TXT"

          # Build args array (avoids mapfile / process substitution which
          # are bash-only and broke under zsh on macOS / pwsh on Windows).
          ARGS=()
          while IFS= read -r f; do
            ARGS+=("$f")
          done < "$FILES_TXT"
          rm -f "$FILES_TXT"

          # Try to create the release. If another matrix job already
          # created it, fall back to uploading our files into the
          # existing release. Idempotent across the 5 parallel jobs.
          if gh release create "$TAG" \
                --title "$TAG" \
                --generate-notes \
                "${ARGS[@]}"; then
            echo "Created release $TAG"
          else
            echo "Release $TAG already exists; uploading our files to it."
            gh release upload "$TAG" "${ARGS[@]}" --clobber
          fi
