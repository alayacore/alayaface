name: Release
on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    outputs:
      frontend_path: ${{ steps.upload.outputs.path }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Frontend
        run: |
          cd src-elm
          wget https://github.com/elm/compiler/releases/download/0.19.2/elm-0.19.2-linux-x64.gz
          gunzip elm-0.19.2-linux-x64.gz
          chmod +x elm-0.19.2-linux-x64
          mv elm-0.19.2-linux-x64 elm
          ./elm make src/Main.elm --output=elm.js
      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-assets
          path: src-elm/elm.js

  publish-tauri:
    needs: build-frontend
    strategy:
      fail-fast: false
      matrix:
        # We define the specific OS and target pairs.
        # The 'runs-on' logic will ensure they run on the correct hardware.
        include:
          - os: macos
            target: aarch64-apple-darwin
          - os: macos
            target: x86_64-apple-darwin
          - os: windows
            target: aarch64-pc-windows-msvc
          - os: windows
            target: x86_64-pc-windows-msvc
          - os: linux
            target: aarch64-unknown-linux-gnu
          - os: linux
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os == 'macos' && 'macos-latest' || matrix.os == 'windows' && 'windows-latest' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-assets
          path: src-elm/
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu, x86_64-apple-darwin, aarch64-apple-darwin, x86_64-pc-windows-msvc, aarch64-pc-windows-msvc
      - name: Install dependencies
        if: github.runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev libxdo-dev libglib2.0-dev
      - name: Install Tauri CLI
        run: cargo install tauri-cli
      - name: Build App
        run: |
          cd src-tauri
          cargo tauri build --target ${{ matrix.target }}
      - name: Upload Release
        uses: softprops/action-gh-release@v1
        if: github.event_name == 'push' && github.ref == 'refs/tags/*'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            src-tauri/target/release/bundle/*.deb
            src-tauri/target/release/bundle/*.msi
            src-tauri/target/release/bundle/*.app
            src-tauri/target/release/bundle/*.appimage
