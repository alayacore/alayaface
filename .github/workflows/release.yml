name: Release
on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    outputs:
      frontend_path: ${{ steps.upload.outputs.path }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Frontend
        run: |
          cd src-elm
          wget https://github.com/elm/compiler/releases/download/0.19.2/elm-0.19.2-linux-x64.gz
          gunzip elm-0.19.2-linux-x64.gz
          chmod +x elm-0.19.2-linux-x64
          mv elm-0.19.2-linux-x64 elm
          ./elm make src/Main.elm --output=elm.js
      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-assets
          path: src-elm/elm.js

  publish-tauri:
    needs: build-frontend
    # Required by softprops/action-gh-release to create the GitHub Release.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # We define the specific OS and target pairs.
        # The 'runner' field picks the matching hardware. For Linux we
        # need *native* aarch64 / x86_64 runners because the Rust
        # build links against system .so files (glib, webkit2gtk) that
        # pkg-config must find on the host — cross-compiling without
        # a sysroot + cross pkg-config wrapper won't work.
        include:
          - os: macos
            target: aarch64-apple-darwin
            runner: macos-latest
          - os: macos
            target: x86_64-apple-darwin
            runner: macos-latest
          - os: windows
            target: aarch64-pc-windows-msvc
            runner: windows-latest
          - os: windows
            target: x86_64-pc-windows-msvc
            runner: windows-latest
          - os: linux
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - os: linux
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-assets
          path: src-elm/
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu, x86_64-apple-darwin, aarch64-apple-darwin, x86_64-pc-windows-msvc, aarch64-pc-windows-msvc
      - name: Install dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev libxdo-dev libglib2.0-dev xdg-utils
      - name: Install Tauri CLI
        run: cargo install tauri-cli
      - name: Build App
        run: |
          cd src-tauri
          cargo tauri build --target ${{ matrix.target }}
      - name: Upload Release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd src-tauri

          TAG="${GITHUB_REF#refs/tags/}"
          BUNDLE_DIR="target/${{ matrix.target }}/release/bundle"

          # Collect every installer artifact Tauri produced for this target.
          # Using 'find' instead of globs so we don't depend on knowing
          # Tauri 2's exact bundle subdirectory layout.
          FILES_TXT="$(mktemp)"
          find "$BUNDLE_DIR" -type f \
              \( -name '*.deb' -o -name '*.AppImage' -o -name '*.msi' -o -name '*.dmg' \) \
              > "$FILES_TXT" 2>/dev/null || true

          if [ ! -s "$FILES_TXT" ]; then
            echo "::warning::No installer files found for ${{ matrix.target }} under $BUNDLE_DIR"
            echo "Bundle directory contents (for debugging):"
            ls -la "$BUNDLE_DIR" 2>/dev/null || echo "  (bundle directory does not exist)"
            rm -f "$FILES_TXT"
            exit 0
          fi

          FILE_COUNT=$(wc -l < "$FILES_TXT")
          echo "Uploading $FILE_COUNT file(s) to release $TAG:"
          sed 's/^/  /' "$FILES_TXT"

          # Build args array (avoids mapfile / process substitution which
          # are bash-only and broke under zsh on macOS / pwsh on Windows).
          ARGS=()
          while IFS= read -r f; do
            ARGS+=("$f")
          done < "$FILES_TXT"
          rm -f "$FILES_TXT"

          # Try to create the release. If another matrix job already
          # created it, fall back to uploading our files into the
          # existing release. Idempotent across the 6 parallel jobs.
          if gh release create "$TAG" \
                --title "$TAG" \
                --generate-notes \
                "${ARGS[@]}"; then
            echo "Created release $TAG"
          else
            echo "Release $TAG already exists; uploading our files to it."
            gh release upload "$TAG" "${ARGS[@]}" --clobber
          fi
