name: Release
on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        platform: ["macos-aarch64", "macos-x86_64", "windows-aarch64", "windows-x86_64", "linux-aarch64", "linux-x86_64"]
    runs-on: ${{ matrix.platform == 'windows/*' && 'windows-latest' || matrix.platform == 'macos/*' && 'macos-latest' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        if: github.runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
          sudo apt-get install -y libwebkit2gtk-4.0-dev || sudo apt-get install -y libwebkit2gtk-4.1-dev
      - name: Install Tauri CLI
        run: cargo install tauri-cli
      - name: Build App
        run: |
          if [[ "${{ matrix.platform }}" == "macos-aarch64" ]]; then
            cargo tauri build --target aarch64-apple-darwin
          elif [[ "${{ matrix.platform }}" == "macos-x86_64" ]]; then
            cargo tauri build --target x86_64-apple-darwin
          elif [[ "${{ matrix.platform }}" == "windows-aarch64" ]]; then
            cargo tauri build --target aarch64-pc-windows-msvc
          elif [[ "${{ matrix.platform }}" == "windows-x86_64" ]]; then
            cargo tauri build --target x86_64-pc-windows-msvc
          elif [[ "${{ matrix.platform }}" == "linux-aarch64" ]]; then
            cargo tauri build --target aarch64-unknown-linux-gnu
          else
            cargo tauri build --target x86_64-unknown-linux-gnu
          fi
      - name: Upload Release
        uses: softprops/action-gh-release@v1
        if: github.event_name == 'push' && github.ref == 'refs/tags/*'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            src-tauri/target/release/bundle/*.deb
            src-tauri/target/release/bundle/*.msi
            src-tauri/target/release/bundle/*.app
            src-tauri/target/release/bundle/*.appimage
