name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src-go/go.mod
          cache-dependency-path: src-go/go.sum
      - name: Vet
        run: go vet ./...
      - name: Test (with race detector)
        run: go test ./... -race -count=1

  elm:
    name: Elm frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Elm 0.19.2 toolchain
        run: npm install -g elm@0.19.2-0 elm-test@0.19.2-0
      - name: Compile
        run: elm make src/Main.elm --output=elm.js
        working-directory: src-elm
      - name: Unit tests
        run: elm-test
        working-directory: src-elm

  rust:
    name: Tauri (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Test
        run: cargo test
        working-directory: src-tauri
