name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src-go/go.mod
          cache-dependency-path: src-go/go.sum
      - name: Vet
        run: go vet ./...
      - name: Test (with race detector)
        run: go test ./... -race -count=1

  elm:
    name: Elm frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Elm 0.19.2 toolchain
        run: npm install -g elm@0.19.2-0 elm-test@0.19.2-0
      - name: Compile
        run: elm make src/Main.elm --output=elm.js
        working-directory: src-elm
      - name: Unit tests
        run: elm-test
        working-directory: src-elm
      # Layout invariants (INV1/SD7): windowPositions is read only through
      # App/Windows' accessors, and the JS bridge carries no behavior
      # decision. Pure grep over the Elm sources — runs where elm-test runs,
      # because it guards the same files.
      - name: Layout invariants check
        run: ./scripts/check-layout-invariants.sh
      # model.conf schema guard: AlayaFace has to model every field AlayaCore
      # sends, or an edit deletes it from the user's model.conf. Uses
      # testdata/alayacore-model-fields.txt here (AlayaCore is a separate
      # repo, absent from CI).
      - name: Model schema check
        run: ./scripts/check-model-schema.sh
      # Protocol drift guard: message_version, the TLV tag alphabet, the session
      # states AlayaCore broadcasts, the command names we send. Uses the
      # testdata/alayacore-*.txt fixtures here (AlayaCore is a separate repo,
      # absent from CI) — the check that would have caught the v12 bump while
      # the adapter still pinned 11.
      - name: AlayaCore protocol check
        run: ./scripts/check-alayacore-protocol.sh
      # Stylesheet parse guard: a rule the browser cannot read is dropped
      # silently, so a whole palette can be dead with a green build. Runs
      # where elm-test runs — it is node-only, no Chrome needed.
      - name: CSS parse check
        run: node scripts/check-css-parse.mjs

  rust:
    name: Tauri (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Test
        run: cargo test
        working-directory: src-tauri
      - name: Build (full Tauri app)
        run: cargo build
        working-directory: src-tauri

  e2e:
    name: E2E (fakecore + headless Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src-go/go.mod
          cache-dependency-path: src-go/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Elm
        run: npm install -g elm@0.19.2-0
      - name: Build elm.js
        run: elm make src/Main.elm --output=elm.js
        working-directory: src-elm
      - name: Backend command parity (Rust vs Go vs bridge)
        run: ./scripts/check-backend-parity.sh
      - name: Install e2e deps
        run: npm install
        working-directory: e2e
      # The script list lives in e2e/scripts.txt, shared with `make e2e` —
      # a list duplicated per runner is how four scripts came to be running
      # nowhere at all.
      #
      # Every script must actually gate the job. `node x.mjs` inside a
      # `while read` loop leaves the loop's exit status to the LAST command
      # in the body (an `echo`), so a failing suite printed its error and
      # the job still went green — that is how three scripts sat broken on a
      # clean checkout. Run them all, then fail on any failure.
      #
      # Output goes to a file, not straight to the console, so a FAILURE can
      # be quoted into the annotation. `pt-e2e` has failed on this job three
      # times ("e2e pt failed") while passing locally every time, and the
      # annotation said nothing more than that — the job log holds the answer
      # but `/actions/jobs/<id>/logs` needs repo admin, so anyone triaging
      # from the API or a phone sees a shrug. Now the failing assertion's own
      # line lands in the check annotations, where it is public.
      - name: E2E (all scripts from e2e/scripts.txt)
        run: |
          failed=()
          for t in $(grep -v '^\s*\#' scripts.txt | grep -v '^\s*$'); do
            echo "::group::$t-e2e.mjs"
            log="/tmp/e2e-$t.log"
            if node "$t-e2e.mjs" > "$log" 2>&1; then
              cat "$log"
            else
              failed+=("$t")
              # The lines that explain it, if the script printed any; else the
              # tail, which is at least where it stopped.
              reason=$(grep -aE 'ASSERT FAILED|FAIL:|\[fatal\]|Error:|ECONN|timeout' "$log" | tail -n 3)
              [ -n "$reason" ] || reason=$(tail -n 3 "$log")
              {
                echo "### e2e \`$t-e2e.mjs\` failed"
                echo ""
                echo '```'
                tail -n 40 "$log"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              # One annotation value = one line: CRs out, `%`/newlines escaped
              # in the order Actions expects.
              flat=$(printf '%s' "$reason" | tr -d '\r' | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
              echo "::error::e2e $t failed: ${flat:0:900}"
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "FAILED e2e suites: ${failed[*]}"
            exit 1
          fi
          echo "all e2e suites passed"
        working-directory: e2e
