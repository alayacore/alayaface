[package]
name = "alayaface"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "alayaface_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
log = "0.4"
env_logger = "0.11"
libdbus-sys = { version = "0.2", features = ["vendored"] }
base64 = "0.22"
open = "5"
url = "2"
urlencoding = "2"
# Voice input ASR: OpenAI-compatible /audio/transcriptions (local or
# remote endpoint — the two only differ by URL). Pure-Rust TLS so the
# desktop build needs no system OpenSSL.
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"

